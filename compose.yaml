services:
  airlinesense:
    build:
      context: .
    image: airlinesense-mlops:production
    container_name: airlinesense
    restart: unless-stopped
    init: true
    ports:
      - "${UI_PORT:-80}:8501"
      - "${API_PORT:-8000}:8000"
    environment:
      AIRLINESENSE_API_URL: http://127.0.0.1:8000
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    security_opt:
      - no-new-privileges:true
