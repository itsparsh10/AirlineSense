data:
  raw_path: data/raw/airline_passenger_satisfaction.csv
  target: Satisfaction
  test_size: 0.20
  random_state: 42

training:
  cv_folds: 3
  scoring: f1
  random_state: 42
  logistic_max_iter: 1000
  random_forest_estimators: 120
  random_forest_max_depth: 16
  random_forest_min_samples_leaf: 2

mlflow:
  tracking_uri: sqlite:///mlflow.db
  experiment_name: airlinesense-classification
  registered_model_name: AirlineSenseClassifier

